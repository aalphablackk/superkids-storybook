
{% extends "base.html" %}

{% block title %}Password Updated | Superkids Storybook{% endblock %}

{% block content %}
<section class="sk-account py-5">
    <div class="container sk-account-container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="sk-account-card card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5 text-center">
                        <div class="sk-empty-state-icon mx-auto mb-4" aria-hidden="true">
                            <i class="bi bi-shield-check"></i>
                        </div>

                        <p class="sk-account-eyebrow">ALL SET</p>
                        <h1 class="sk-account-title h2 mb-3">Password updated</h1>
                        <p class="sk-account-subtitle mx-auto mb-4">
                            Your password has been changed successfully.
                            You can now sign in with your new password.
                        </p>

                        <a href="{% url 'accounts:login' %}" class="btn btn-primary">
                            Sign In
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
