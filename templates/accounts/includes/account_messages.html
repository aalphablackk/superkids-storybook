
{% if messages %}
    <div class="mb-4" aria-live="polite" aria-atomic="true">
        {% for message in messages %}
            <div
                class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags == 'message' %}info{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show"
                role="alert"
            >
                {{ message }}
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Dismiss notification"
                ></button>
            </div>
        {% endfor %}
    </div>
{% endif %}
